services:
  # ─── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: meuponto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # DEFINA DB_PASSWORD nas variáveis da Stack (Portainer) ou no .env.
      # Sem valor, o Postgres recusa iniciar — de propósito: é melhor do que
      # subir com uma senha default conhecida.
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-meuponto}
    ports:
      # Só no loopback do host. O backend fala com "db:5432" pela rede interna;
      # para acessar de fora, use um túnel SSH em vez de abrir a porta.
      - '127.0.0.1:5432:5432'
    volumes:
      - meuponto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  # ─── Backend (Node.js / Express) ───────────────────────
  backend:
    image: meuponto-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meuponto-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}'
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3333}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-meuponto}?schema=public
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD}
      # Web Push — sem estas chaves o backend gera chaves VAPID efêmeras e as
      # inscrições de notificação quebram a cada restart. Defina nas variáveis da
      # Stack (Portainer). A privada é SEGREDO.
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@meuponto.com}
      # Origem(ns) permitida(s) no CORS em produção (separe por vírgula). Vazio = *
      WEB_ORIGIN: ${WEB_ORIGIN:-}
    depends_on:
      - db
    deploy:
      resources:
        limits:
          memory: 512M
    networks:
      - internal

  # ─── Frontend (React / Vite) ───────────────────────────
  frontend:
    image: meuponto-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meuponto-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          memory: 128M
    networks:
      - internal
      # - proxy

volumes:
  meuponto_pgdata:

networks:
  internal:
  # proxy:
  #   # Rede compartilhada entre todas as stacks, criada pela stack infra-proxy.
  #   # Se ainda nao existe no servidor, crie uma unica vez:
  #   #   docker network create proxy
  #   external: true
