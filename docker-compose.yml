version: '3.8'

services:
  # ─── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: meuponto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-meuponto}
    ports:
      - '5432:5432'
    volumes:
      - meuponto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── Backend (Node.js / Express) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meuponto-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}'
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3333}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-password}@db:5432/${DB_NAME:-meuponto}?schema=public
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:-1234}
    depends_on:
      db:
        condition: service_healthy

  # ─── Frontend (React / Vite) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meuponto-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      - backend

volumes:
  meuponto_pgdata:
