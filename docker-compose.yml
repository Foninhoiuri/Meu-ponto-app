services:
  # ─── PostgreSQL ────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: meuponto-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      # Sem default: preferimos falhar a subir com "password"
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env/Portainer}
      POSTGRES_DB: ${DB_NAME:-meuponto}
    ports:
      # Só no loopback do host. O backend fala com "db:5432" pela rede interna;
      # para acessar de fora, use um túnel SSH em vez de abrir a porta.
      - '127.0.0.1:5432:5432'
    volumes:
      - meuponto_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 5
    mem_limit: 512m
    networks:
      - internal

  # ─── Backend (Node.js / Express) ───────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: meuponto-backend
    restart: unless-stopped
    ports:
      - '${BACKEND_PORT:-3333}:${BACKEND_PORT:-3333}'
    environment:
      NODE_ENV: production
      PORT: ${BACKEND_PORT:-3333}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD}@db:5432/${DB_NAME:-meuponto}?schema=public
      DEFAULT_PASSWORD: ${DEFAULT_PASSWORD:?defina DEFAULT_PASSWORD no .env/Portainer}
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 512m
    networks:
      - internal

  # ─── Frontend (React / Vite) ───────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meuponto-frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-80}:80'
    depends_on:
      - backend
    mem_limit: 128m
    networks:
      - internal
      - proxy
    labels:
      - 'traefik.enable=true'
      - 'traefik.http.routers.meuponto.rule=Host(`${APP_HOST:-ponto.local}`)'
      - 'traefik.http.routers.meuponto.entrypoints=websecure'
      - 'traefik.http.routers.meuponto.tls.certresolver=le'
      - 'traefik.http.services.meuponto.loadbalancer.server.port=80'

volumes:
  meuponto_pgdata:

networks:
  internal:
  proxy:
    external: true
